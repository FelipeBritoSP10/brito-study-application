<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brito.Study</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">

</head>
<body>

  <div class="wrap">

  <div class="top-bar">
    <div class="logo">
      <div class="logo-icon"><i class="ti ti-book-2"></i></div>
      <div class="logo-name">Brito<span>.Study</span></div>
    </div>
    <div class="pill">Caderno Digital</div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Registros</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statMaterias">0</div>
      <div class="stat-label">Disciplinas</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statHoje">0</div>
      <div class="stat-label">Hoje</div>
    </div>
  </div>

  <div class="form-card">
    <div class="form-card-title">
      <i class="ti ti-pencil-plus"></i>
      Novo registro
    </div>
    <div class="field">
      <label for="materia">Disciplina</label>
      <input type="text" id="materia" placeholder="Ex: Álgebra Linear, Termodinâmica...">
    </div>
    <div class="field">
      <label for="conteudo">Anotações</label>
      <textarea id="conteudo" placeholder="Conceitos, fórmulas, resumos técnicos..."></textarea>
    </div>
    <button class="btn-add" id="btnSalvar">
      <i class="ti ti-plus"></i>
      Adicionar registro
    </button>
  </div>

  <div class="list-header">
    <div class="list-title">Registros de estudo</div>
    <div class="count" id="countEl">0</div>
  </div>

  <div id="lista">
  </div>

</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
